# عند كل push على main: يبني APK موقّع، ينشئ Release جديد (التطبيق يكتشفه ويحدّث نفسه)
# ويبني نسخة الويب وينشرها على GitHub Pages (تتحدث فوراً).
# تعديل remote/config.json فقط لا يبني نسخة جديدة – التطبيق يقرأه مباشرة.
name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'remote/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        id: ver
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | cut -d. -f1,2)
          BUILD=${{ github.run_number }}
          echo "name=$BASE.$BUILD" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Setup signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
          sed -i 's/^ *//' android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.build }}
          cp build/app/outputs/flutter-apk/app-release.apk todo-${{ steps.ver.outputs.name }}.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%B)
          gh release create "v${{ steps.ver.outputs.name }}" \
            "todo-${{ steps.ver.outputs.name }}.apk" \
            --title "الإصدار ${{ steps.ver.outputs.name }}" \
            --notes "$NOTES" \
            --latest

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
